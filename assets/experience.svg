<svg viewBox="0 0 1000 370" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Experience — Ambian Strategy, VIT SRIP, GeoPacific Solutions, VIT Chennai">
  <style>
    :root { --bone: #444444; --rule: #C0C0C0; --muted: #888888; --dim: #AAAAAA; --accent: #555555; }
    @media (prefers-color-scheme: dark) { :root { --bone: #DDDDDD; --rule: #444444; --muted: #777777; --dim: #666666; --accent: #AAAAAA; } }
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .rise { opacity: 0; animation: rise .7s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity:0;transform:translateY(8px); } to { opacity:1;transform:translateY(0); } }
    .a1{animation-delay:.15s} .a2{animation-delay:.35s} .a3{animation-delay:.55s} .a4{animation-delay:.75s}
    @media (prefers-reduced-motion: reduce) { .rise { animation: none; opacity: 1; } }
      :root { --bone: #000000; --muted: #000000; --dim: #000000; --rule: #000000; --accent: #000000; --node-bg: #FFFFFF; --core-bg: #FFFFFF; }
  :root { --bone:#FFFFFF; --muted:#FFFFFF; --dim:#FFFFFF; --rule:#FFFFFF; --accent:#FFFFFF; --node-bg:#000000; --core-bg:#000000; --ghost:#FFFFFF; --ink:#FFFFFF; --paper:#000000; --ghost:#FFFFFF; }
</style>

  <line x1="120" y1="10" x2="120" y2="360" stroke="var(--rule)" stroke-width="1" opacity=".4"/>

  <g class="rise a1">
    <text class="mono" x="48" y="330" font-size="12" fill="var(--accent)" letter-spacing="2">2026</text>
    <text class="mono" x="136" y="330" font-size="15" fill="var(--bone)">VIT Vellore · M.Tech Computer Science &amp; Engineering\ · Software Engineering, Data Science &amp; AI/ML</text>
  </g>

  <g class="rise a2">
    <text class="mono" x="48" y="234" font-size="12" fill="var(--accent)" letter-spacing="2">2025</text>
    <text class="mono" x="136" y="234" font-size="15" fill="var(--bone)">Bussin Design Studio · Product Design Intern · Apr 25 – Jul 26</text>
    <text class="mono" x="136" y="260" font-size="14" fill="var(--muted)">Product Design · App &amp; Website Design · System Components Design</text>
    <text class="mono" x="136" y="282" font-size="14" fill="var(--muted)">Figma · Adobe Photoshop · Adobe Illustrator</text>
  </g>

  <g class="rise a3">
    <text class="mono" x="48" y="330" font-size="12" fill="var(--accent)" letter-spacing="2">2022 –</text>
    <text class="mono" x="136" y="330" font-size="15" fill="var(--bone)">VIT Vellore · B.Tech Computer Science &amp; Engineering (Data Science) · Data Science &amp; AI/ML</text>
    <text class="mono" x="136" y="68"  font-size="14" fill="var(--muted)">Worked on RL-based LLM hallucination mitigation and multimodal NLP systems for factuality, sentiment analysis, and rating prediction.</text>
  </g>
</svg>
