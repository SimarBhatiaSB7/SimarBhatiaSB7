<svg viewBox="0 0 1000 330" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Telemetry: language distribution, shipping velocity 2024 to 2026, counters — 15 projects and 4 platforms">
  <style><![CDATA[
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap');
    :root { --bone: #444444; --muted: #888888; --dim: #AAAAAA; --rule: #C0C0C0; --accent: #555555; }
    @media (prefers-color-scheme: dark) { :root { --bone: #DDDDDD; --muted: #777777; --dim: #666666; --rule: #444444; --accent: #AAAAAA; } }
    text { font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 16px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .bar { transform: scaleX(0); animation: grow 1.2s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes grow { to { transform: scaleX(1); } }
    .g1{transform-origin:48px 0;animation-delay:.3s}.g2{transform-origin:48px 0;animation-delay:.45s}.g3{transform-origin:48px 0;animation-delay:.6s}
    .g4{transform-origin:48px 0;animation-delay:.75s}.g5{transform-origin:48px 0;animation-delay:.9s}.g6{transform-origin:48px 0;animation-delay:1.05s}
    .spark { stroke-dasharray: 700; stroke-dashoffset: 700; animation: draw 2.2s cubic-bezier(.6,0,.2,1) .5s forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .dot { opacity: 0; animation: fade .4s ease forwards; }
    .d1{animation-delay:1.0s}.d2{animation-delay:1.3s}.d3{animation-delay:1.6s}.d4{animation-delay:1.9s}.d5{animation-delay:2.2s}.d6{animation-delay:2.5s}
    @keyframes fade { to { opacity: 1; } }
    .rise { opacity: 0; animation: rise .8s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
    .n1{animation-delay:.5s}.n2{animation-delay:.7s}.n3{animation-delay:.9s}.n4{animation-delay:1.1s}
    .ping { animation: ping 2.2s ease-out infinite; transform-origin: 622px 116px; }
    @keyframes ping { 0%{transform:scale(.4);opacity:.9} 80%,100%{transform:scale(2.8);opacity:0} }
    @media (prefers-reduced-motion: reduce) {
      .bar,.spark,.dot,.rise,.ping { animation: none; }
      .bar{transform:scaleX(1)} .spark{stroke-dashoffset:0} .dot,.rise{opacity:1} .ping{opacity:0}
    }
      :root { --bone: #000000; --muted: #000000; --dim: #000000; --rule: #000000; --accent: #000000; --node-bg: #FFFFFF; --core-bg: #FFFFFF; }
  :root { --bone:#FFFFFF; --muted:#FFFFFF; --dim:#FFFFFF; --rule:#FFFFFF; --accent:#FFFFFF; --node-bg:#000000; --core-bg:#000000; --ghost:#FFFFFF; --ink:#FFFFFF; --paper:#000000; --ghost:#FFFFFF; }
  ]]></style>

  <line x1="48" y1="40" x2="952" y2="40" stroke="var(--rule)"/>
  <text fill="var(--muted)" class="mono" x="48" y="28" font-size="11" letter-spacing="3.5">TELEMETRY — WHAT THE HANDS ARE DOING</text>
  <text fill="var(--muted)" class="mono" x="952" y="28" font-size="11" letter-spacing="3.5" text-anchor="end">FIG. 02</text>

  <!-- single centered divider, even margins either side -->
  <line x1="500" y1="64" x2="500" y2="296" stroke="var(--rule)" opacity=".4"/>

  <!-- language bars — stepped greys (left half: x 48 → 460) -->
  <text fill="var(--dim)" class="mono" x="48" y="78" font-size="10" letter-spacing="2.5">LANGUAGE DISTRIBUTION · EST.</text>
  <g class="mono" font-size="11">
    <text fill="var(--bone)" x="48" y="108">Python</text>       <rect class="bar g1" x="48" y="116" width="203" height="6" fill="var(--accent)"/><text fill="var(--muted)" x="425" y="123" font-size="10">27%</text>
    <text fill="var(--bone)" x="48" y="146">C++</text>  <rect class="bar g2" x="48" y="154" width="190" height="6" fill="var(--bone)"/><text fill="var(--muted)" x="425" y="161" font-size="10">24%</text>
    <text fill="var(--bone)" x="48" y="184">typescript</text>      <rect class="bar g3" x="48" y="192" width="163" height="6" fill="var(--bone)"/><text fill="var(--muted)" x="425" y="199" font-size="10">17%</text>
    <text fill="var(--bone)" x="48" y="222">javascript</text>  <rect class="bar g4" x="48" y="230" width="148" height="6" fill="var(--bone)"/><text fill="var(--muted)" x="425" y="237" font-size="10">13%</text>
    <text fill="var(--bone)" x="48" y="260">HTML</text>        <rect class="bar g5" x="48" y="268" width="113"  height="6" fill="var(--bone)"/><text fill="var(--muted)" x="425" y="275" font-size="10">10%</text>
    <text fill="var(--bone)" x="48" y="298">Others</text> <rect class="bar g6" x="48" y="306" width="98"  height="6" fill="var(--bone)"/><text fill="var(--muted)" x="425" y="313" font-size="10">9%</text>
  </g>

  <!-- profile counters (right half: x 540 → 952, mirrors left margin) -->
  <g>
    <g class="rise n1">
      <text fill="var(--bone)" class="mono" x="570" y="115" font-size="64" text-anchor="end" dominant-baseline="central">51</text>
      <text fill="var(--muted)" class="mono" x="600" y="115" font-size="10" letter-spacing="2.5" dominant-baseline="central">REPOSITORIES</text>
    </g>
    <g class="rise n2">
      <text fill="var(--bone)" class="mono" x="570" y="175" font-size="64" text-anchor="end" dominant-baseline="central">15</text>
      <text fill="var(--muted)" class="mono" x="600" y="175" font-size="10" letter-spacing="2.5" dominant-baseline="central">PROJECTS DOCUMENTED</text>
    </g>
    <g class="rise n3">
      <text fill="var(--bone)" class="mono" x="570" y="235" font-size="64" text-anchor="end" dominant-baseline="central">4</text>
      <text fill="var(--muted)" class="mono" x="600" y="235" font-size="10" letter-spacing="2.5" dominant-baseline="central">PLATFORMS — iOS / WEB / CLI / FLUTTER</text>
    </g>
    <g class="rise n4">
      <text fill="var(--accent)" class="mono" x="570" y="295" font-size="64" text-anchor="end" dominant-baseline="central">∞</text>
      <text fill="var(--muted)" class="mono" x="600" y="295" font-size="10" letter-spacing="2.5" dominant-baseline="central">TERMINAL TABS OPEN RIGHT NOW</text>
    </g>
  </g>
</svg>
